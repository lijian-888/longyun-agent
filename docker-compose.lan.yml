# Production deployment profile for the institute intranet.  Keep
# docker-compose.yml for local development; start this file explicitly with
# deploy/.env.production.  Only gateway publishes a host port.  Database, API,
# MinerU and Keycloak remain on the Docker network.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rice_demo
      POSTGRES_USER: rice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in deploy/.env.production}
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rice -d rice_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-production-roles.sh:/docker-entrypoint-initdb.d/10-create-production-roles.sh:ro
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env.production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    image: longyun-agent-api:${RELEASE_TAG:-lan}
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rice_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in deploy/.env.production}@db:5432/rice_demo
      MIGRATION_DATABASE_URL: postgresql+psycopg://rice:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}@db:5432/rice_demo
      APP_DATABASE_ROLE: rice_app
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in deploy/.env.production}
      INSTITUTION_DATA_ENABLED: ${INSTITUTION_DATA_ENABLED:-true}
      INSTITUTION_UPLOAD_STAGING_DIR: /data/raw/institution-staging
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/.env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/.env.production}
      MINIO_SECURE: "false"
      DEPLOYMENT_ENV: production
      RAW_STORAGE_DIR: /data/raw
      RESEARCH_STORAGE_DIR: /data/research
      ENABLE_SOURCE_DEDUPLICATION: ${ENABLE_SOURCE_DEDUPLICATION:-true}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_PLATFORM_URL:?Set PUBLIC_PLATFORM_URL in deploy/.env.production}
      TRUSTED_HOSTS: ${PUBLIC_PLATFORM_HOST:?Set PUBLIC_PLATFORM_HOST in deploy/.env.production},api,web,localhost,127.0.0.1
      KEYCLOAK_ISSUER: ${PUBLIC_PLATFORM_URL:?Set PUBLIC_PLATFORM_URL in deploy/.env.production}/auth/realms/rice-research
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/rice-research/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: rice-research-web
      SHENNONG_API_BASE_URL: ${SHENNONG_API_BASE_URL:-https://api.agent-tech.cc/api/v1}
      SHENNONG_MODEL: ${SHENNONG_MODEL:-sn}
      SHENNONG_API_KEY: ${SHENNONG_API_KEY:-}
      # Keep the production ACPs surface disabled until Registry approval,
      # AIC assignment and CA certificates have all been installed.
      ACPS_ENABLED: ${ACPS_ENABLED:-false}
      ACPS_ROLE: ${ACPS_ROLE:-hybrid}
      ACPS_AIC: ${ACPS_AIC:-}
      ACPS_AGENT_NAME: ${ACPS_AGENT_NAME:-隆耘 Agent 育种智能体}
      ACPS_AGENT_VERSION: ${ACPS_AGENT_VERSION:-1.0.0}
      ACPS_PUBLIC_BASE_URL: ${ACPS_PUBLIC_BASE_URL:-http://localhost:5183}
      ACPS_DOCUMENTATION_URL: ${ACPS_DOCUMENTATION_URL:-https://github.com/lijian-888/longyun-agent/blob/codex/main-rework/docs/ACPS-INTEGRATION.md}
      ACPS_RPC_URL: ${ACPS_RPC_URL:-http://localhost:5183/acps/rpc}
      ACPS_DISCOVERY_BASE_URL: ${ACPS_DISCOVERY_BASE_URL:-}
      ACPS_MTLS_ENABLED: ${ACPS_MTLS_ENABLED:-false}
      ACPS_REQUIRE_VERIFIED_CLIENT: ${ACPS_REQUIRE_VERIFIED_CLIENT:-false}
      ACPS_CLIENT_CERT_FILE: ${ACPS_CLIENT_CERT_FILE:-/data/acps/client.pem}
      ACPS_CLIENT_KEY_FILE: ${ACPS_CLIENT_KEY_FILE:-/data/acps/client-key.pem}
      ACPS_TRUST_BUNDLE_FILE: ${ACPS_TRUST_BUNDLE_FILE:-/data/acps/trust-bundle.pem}
      ACPS_CERTIFICATE_DNS_NAMES: ${ACPS_CERTIFICATE_DNS_NAMES:-}
      ACPS_CERTIFICATE_IP_ADDRESSES: ${ACPS_CERTIFICATE_IP_ADDRESSES:-}
      ACPS_PROVIDER_DOMAIN: ${ACPS_PROVIDER_DOMAIN:-}
      ACPS_PROVIDER_DOMAIN_REGISTRATION_NUMBER: ${ACPS_PROVIDER_DOMAIN_REGISTRATION_NUMBER:-}
      ACPS_PROVIDER_DOMAIN_REGISTRATION_TYPE: ${ACPS_PROVIDER_DOMAIN_REGISTRATION_TYPE:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DOC_PARSE_MODE: ${DOC_PARSE_MODE:-local}
      # The CPU parser pipeline is deliberately serial.  More parallel workers
      # compete with MinerU, Docling and OCR for the same host CPU.
      KNOWLEDGE_DOCUMENT_CONCURRENCY: ${KNOWLEDGE_DOCUMENT_CONCURRENCY:-1}
      MINERU_API_URL: http://mineru:8001
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_PARSE_TIMEOUT_SECONDS: ${MINERU_PARSE_TIMEOUT_SECONDS:-900}
      # Must exceed the MinerU worker timeout so the worker returns its own
      # actionable status rather than an outer generic HTTP timeout.
      MINERU_REQUEST_TIMEOUT_SECONDS: ${MINERU_REQUEST_TIMEOUT_SECONDS:-960}
      HF_HOME: /data/models/huggingface
      MODELSCOPE_CACHE: /data/models/modelscope
      PADDLE_PDX_CACHE_HOME: /data/models/paddlex
      FLAGS_use_mkldnn: "0"
      PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "False"
      DOCLING_ARTIFACTS_PATH: /data/models/docling
      DOCLING_DOCUMENT_TIMEOUT_SECONDS: ${DOCLING_DOCUMENT_TIMEOUT_SECONDS:-600}
      BGE_M3_MODEL_PATH: /data/models/bge-m3
      BGE_M3_MODEL_SOURCE: ${BGE_M3_MODEL_SOURCE:-modelscope}
      BGE_M3_MODEL_REPOSITORY: ${BGE_M3_MODEL_REPOSITORY:-BAAI/bge-m3}
      BGE_M3_HF_ENDPOINT: ${BGE_M3_HF_ENDPOINT:-}
      RICE_GFF3_PATH: ${RICE_GFF3_PATH:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mineru:
        condition: service_healthy
    volumes:
      - raw_data:/data/raw
      - research_data:/data/research
      - model_data:/data/models
      - ./reference:/data/reference:ro
      - ./deploy/acps/runtime:/data/acps:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    image: longyun-agent-web:${RELEASE_TAG:-lan}
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_PLATFORM_URL:?Set PUBLIC_PLATFORM_URL in deploy/.env.production}/auth
        VITE_KEYCLOAK_REALM: rice-research
        VITE_KEYCLOAK_CLIENT_ID: rice-research-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  genotype-worker:
    image: longyun-agent-api:${RELEASE_TAG:-lan}
    command: ["python", "-m", "app.genotype_worker"]
    restart: unless-stopped
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://rice:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}@db:5432/rice_demo
      RESEARCH_STORAGE_DIR: /data/research
      PLINK2_BINARY: /usr/local/bin/plink2
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - research_data:/data/research
    security_opt:
      - no-new-privileges:true

  mineru:
    image: longyun-agent-mineru:${RELEASE_TAG:-lan}
    build: ./mineru
    restart: unless-stopped
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_PARSE_TIMEOUT_SECONDS: ${MINERU_PARSE_TIMEOUT_SECONDS:-900}
      HF_HOME: /data/models/huggingface
      MODELSCOPE_CACHE: /data/models/modelscope
    volumes:
      - mineru_model_data:/data/models
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start", "--import-realm", "--http-enabled=true", "--http-relative-path=/auth", "--proxy-headers=xforwarded"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/rice_demo
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Set KEYCLOAK_DATABASE_PASSWORD in deploy/.env.production}
      KC_DB_SCHEMA: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-platform-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deploy/.env.production}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      # Keycloak is exposed by the gateway under /auth.  Its public hostname
      # must include that context path so generated theme assets resolve to
      # /auth/resources/... rather than being sent to the web application's
      # catch-all /resources route.
      KC_HOSTNAME: ${PUBLIC_PLATFORM_URL:?Set PUBLIC_PLATFORM_URL in deploy/.env.production}/auth
      KC_HOSTNAME_STRICT: "true"
      PUBLIC_PLATFORM_URL: ${PUBLIC_PLATFORM_URL:?Set PUBLIC_PLATFORM_URL in deploy/.env.production}
      INITIAL_RESEARCHER_PASSWORD: ${INITIAL_RESEARCHER_PASSWORD:?Set INITIAL_RESEARCHER_PASSWORD in deploy/.env.production}
      INITIAL_PROCESSOR_PASSWORD: ${INITIAL_PROCESSOR_PASSWORD:?Set INITIAL_PROCESSOR_PASSWORD in deploy/.env.production}
      INITIAL_FIELD_ADMIN_PASSWORD: ${INITIAL_FIELD_ADMIN_PASSWORD:?Set INITIAL_FIELD_ADMIN_PASSWORD in deploy/.env.production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/keycloak/rice-research-realm.json:/opt/keycloak/data/import/rice-research-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE in deploy/.env.production}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE in deploy/.env.production}:/etc/nginx/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mineru-model-warmup:
    image: longyun-agent-mineru:${RELEASE_TAG:-lan}
    profiles: ["warmup"]
    command: ["python", "warm_models.py"]
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_PARSE_TIMEOUT_SECONDS: ${MINERU_PARSE_TIMEOUT_SECONDS:-900}
      HF_HOME: /data/models/huggingface
      MODELSCOPE_CACHE: /data/models/modelscope
    volumes:
      - mineru_model_data:/data/models
    security_opt:
      - no-new-privileges:true

  model-warmup:
    image: longyun-agent-api:${RELEASE_TAG:-lan}
    profiles: ["warmup"]
    command: ["python", "-m", "app.warm_models"]
    environment:
      HF_HOME: /data/models/huggingface
      MODELSCOPE_CACHE: /data/models/modelscope
      PADDLE_PDX_CACHE_HOME: /data/models/paddlex
      FLAGS_use_mkldnn: "0"
      PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT: "False"
      DOCLING_ARTIFACTS_PATH: /data/models/docling
      DOCLING_DOCUMENT_TIMEOUT_SECONDS: ${DOCLING_DOCUMENT_TIMEOUT_SECONDS:-600}
      BGE_M3_MODEL_PATH: /data/models/bge-m3
      BGE_M3_MODEL_SOURCE: ${BGE_M3_MODEL_SOURCE:-modelscope}
      BGE_M3_MODEL_REPOSITORY: ${BGE_M3_MODEL_REPOSITORY:-BAAI/bge-m3}
      BGE_M3_HF_ENDPOINT: ${BGE_M3_HF_ENDPOINT:-}
    volumes:
      - model_data:/data/models

volumes:
  postgres_data:
  minio_data:
  raw_data:
  research_data:
  model_data:
  mineru_model_data:
