server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The platform permits bulk knowledge files. Per-file authorization and
    # size validation still occurs in the API.
    client_max_body_size 550m;
    client_body_timeout 1800s;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keycloak uses X-Forwarded-Port in preference to the port embedded in
    # X-Forwarded-Host. Preserve the browser's external port (8443 for the
    # shared-server deployment) so its themed CSS/JS URLs do not fall back to
    # the unrelated service listening on port 443.
    set $keycloak_forwarded_port 443;
    if ($http_host ~* ":(?<requested_external_port>[0-9]+)$") {
        set $keycloak_forwarded_port $requested_external_port;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keycloak is published beneath the same HTTPS origin.  No standalone
    # authentication port is exposed to the institute network.
    location = /auth {
        return 308 /auth/;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $keycloak_forwarded_port;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
