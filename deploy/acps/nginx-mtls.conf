# Nginx 1.27 exposes the full RFC 2253 subject but not a dedicated CN
# variable. ACPs identity certificates put the AIC in the subject CN.
map $ssl_client_s_dn $acps_client_aic {
    default "";
    ~(?:^|,)CN=([^,]+) $1;
}

# Dedicated ACPs Partner ingress. It is separate from the browser gateway so
# a client certificate is mandatory here without affecting normal web users.
server {
    listen 9443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/acps/server.pem;
    ssl_certificate_key /etc/nginx/acps/server-key.pem;
    ssl_client_certificate /etc/nginx/acps/trust-bundle.pem;
    ssl_verify_client on;
    ssl_verify_depth 4;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    location = /acps/rpc {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AIC is the subject CN of an ACPs CA identity certificate. The API
        # trusts this header only when ACPS_REQUIRE_VERIFIED_CLIENT=true and
        # only this gateway can reach its internal Docker port.
        proxy_set_header X-ACPS-Client-AIC $acps_client_aic;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /acps/health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-ACPS-Client-AIC $acps_client_aic;
    }

    location / {
        return 404;
    }
}
