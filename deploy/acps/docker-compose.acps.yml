# Optional production override that publishes a dedicated ACPs mTLS ingress.
# Usage is documented in docs/ACPS-INTEGRATION.md.
services:
  gateway:
    ports:
      - "${ACPS_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./deploy/acps/nginx-mtls.conf:/etc/nginx/conf.d/acps-mtls.conf:ro
      - ${ACPS_SERVER_CERT_FILE:?Set ACPS_SERVER_CERT_FILE}:/etc/nginx/acps/server.pem:ro
      - ${ACPS_SERVER_KEY_FILE:?Set ACPS_SERVER_KEY_FILE}:/etc/nginx/acps/server-key.pem:ro
      - ${ACPS_GATEWAY_TRUST_BUNDLE_FILE:?Set ACPS_GATEWAY_TRUST_BUNDLE_FILE}:/etc/nginx/acps/trust-bundle.pem:ro
