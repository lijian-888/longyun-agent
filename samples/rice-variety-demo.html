    <h1>示范两优1号（示范优1）</h1>
    <h2>特征特性</h2>
    <p>全生育期118.6天，比对照早熟2.1天。株型适中，分蘖力较强。株高108.6厘米，亩有效穗20.1万，每穗总粒数128.4粒，实粒数105.8粒，结实率82.4%，千粒重26.1克。</p>
    <p>出糙率80.2%，整精米率63.4%，垩白粒率8.2%，垩白度1.3%，直链淀粉含量18.6%，胶稠度58mm，粒长7.1mm，长宽比3.2。</p>
    <p>稻瘟病抗性自然诱发鉴定：苗瘟1级，叶瘟3级，穗瘟4级。</p>
    <h2>产量表现</h2>
    <p>区域试验平均亩产512.8公斤。</p>
