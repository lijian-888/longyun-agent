[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os

# The application injects the institution-specific migration URL at runtime.
# Keeping a non-routable value here prevents accidental migration of a
# developer or production database from a copied configuration file.
sqlalchemy.url = postgresql+psycopg://invalid:invalid@invalid/invalid

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
